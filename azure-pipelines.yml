# ============================================================
# Azure Pipelines — Portfolio platform (manual trigger only)
# ============================================================
# Runs the same deploy.ps1 that works locally, but inside an
# AzureCLI@2 task so `az` is pre-authenticated via the service
# connection. No CI on push, no PR validation — manual only.
# ============================================================

trigger: none
pr: none

parameters:
  - name: resourceGroup
    displayName: Resource group
    type: string
    default: rg-portfolio-dev
  - name: location
    displayName: Azure region
    type: string
    default: centralindia
  - name: cleanupOnFailure
    displayName: Delete all RG contents + purge KV if any stage fails
    type: boolean
    default: true

variables:
  - name: azureServiceConnection
    value: portfolio-azure-sc   # change to whatever you named the service connection
  # APP_SECRET is defined as a SECRET pipeline variable in the UI
  # (Pipelines → Edit → Variables → New → check "Keep this value secret").

pool:
  vmImage: windows-latest       # PowerShell + Windows az.cmd path match local behaviour

stages:
  - stage: Deploy
    displayName: Deploy infra, API and frontend
    jobs:
      - job: Deploy
        displayName: Run deploy.ps1
        timeoutInMinutes: 30
        steps:
          - checkout: self
            displayName: Checkout repo

          - task: AzureCLI@2
            displayName: Run deploy.ps1 (Bicep + API + Frontend)
            env:
              APP_SECRET: $(APP_SECRET)
            inputs:
              azureSubscription: $(azureServiceConnection)
              scriptType: pscore
              scriptLocation: inlineScript
              inlineScript: |
                Write-Host "Working directory: $PWD"
                Write-Host "az version:"
                az version --output table
                ./deploy.ps1 `
                  -ResourceGroup "${{ parameters.resourceGroup }}" `
                  -Location "${{ parameters.location }}" `
                  -AppSecret $env:APP_SECRET

          - task: AzureCLI@2
            displayName: Smoke test endpoints
            inputs:
              azureSubscription: $(azureServiceConnection)
              scriptType: pscore
              scriptLocation: inlineScript
              inlineScript: |
                $rg = "${{ parameters.resourceGroup }}"
                $func = az functionapp list -g $rg --query "[?starts_with(name,'portfolio-func-')].name | [0]" -o tsv
                $sa   = az storage account list -g $rg --query "[?starts_with(name,'portfoliost')].name | [0]" -o tsv
                $api  = "https://$func.azurewebsites.net"
                $fe   = "https://$sa.z29.web.core.windows.net"

                Write-Host "API:      $api"
                Write-Host "Frontend: $fe"

                # Flex Consumption can take 60-180s after deploy for new
                # functions (especially ones with npm deps) to register on the
                # host. Retry each endpoint until it returns success, with a
                # 5-minute cap, before failing the smoke test.
                function Invoke-WithRetry {
                    param([string]$Name, [scriptblock]$Call)
                    $deadline = (Get-Date).AddMinutes(5)
                    $attempt  = 0
                    while ((Get-Date) -lt $deadline) {
                        $attempt++
                        try {
                            $r = & $Call
                            if ($r -and $r.success) {
                                Write-Host "  $Name OK on attempt $attempt" -ForegroundColor Green
                                return $r
                            }
                            Write-Host "  $Name returned no success flag on attempt $attempt, retrying..." -ForegroundColor DarkYellow
                        } catch {
                            $code = $_.Exception.Response.StatusCode.value__
                            Write-Host "  $Name attempt $attempt failed (HTTP $code), retrying in 15s..." -ForegroundColor DarkYellow
                        }
                        Start-Sleep 15
                    }
                    throw "$Name never succeeded within timeout"
                }

                Write-Host "`n--- GET /api/profile ---"
                $profile = Invoke-WithRetry -Name "profile" -Call {
                    Invoke-RestMethod -Uri "$api/api/profile" -Method Get -TimeoutSec 20
                }
                $profile | ConvertTo-Json -Depth 4

                Write-Host "`n--- POST /api/visitors ---"
                $visit = Invoke-WithRetry -Name "visitors" -Call {
                    Invoke-RestMethod -Uri "$api/api/visitors" -Method Post -ContentType "application/json" -TimeoutSec 20
                }
                $visit | ConvertTo-Json

                Write-Host "`nAll smoke tests passed." -ForegroundColor Green

  - stage: Cleanup
    displayName: Cleanup on failure (delete RG contents)
    dependsOn: Deploy
    # Run ONLY if the Deploy stage failed AND the user opted in (default: true).
    condition: and(failed(), eq('${{ parameters.cleanupOnFailure }}', 'true'))
    jobs:
      - job: Teardown
        displayName: Delete every resource the pipeline created
        timeoutInMinutes: 30
        steps:
          - task: AzureCLI@2
            displayName: Delete all resources inside RG + purge soft-deleted Key Vaults
            inputs:
              azureSubscription: $(azureServiceConnection)
              scriptType: pscore
              scriptLocation: inlineScript
              inlineScript: |
                $rg  = "${{ parameters.resourceGroup }}"
                $loc = "${{ parameters.location }}"

                Write-Host "Deploy stage failed — cleaning up resources inside '$rg'..." -ForegroundColor Yellow
                Write-Host "(The resource group itself is preserved — only its contents are removed.)`n"

                # Preserve resources we don't want recreated on every run:
                #  - portfolio-pipeline-mi : the MI we're authenticating with right now
                #  - any Microsoft.KeyVault/vaults : KV soft-delete makes recreation slow,
                #    so keep the vault across runs (Bicep is idempotent on it).
                $miName = "portfolio-pipeline-mi"
                $preserveQuery = "[?name!='$miName' && type!='Microsoft.KeyVault/vaults'].id"

                $ids = az resource list -g $rg --query $preserveQuery -o tsv
                if (-not $ids) {
                    Write-Host "RG has nothing to delete (MI and KV preserved)."
                } else {
                    $idArray = $ids -split "`n" | Where-Object { $_ }
                    Write-Host "Found $($idArray.Count) resource(s) to delete (MI + KV preserved):"
                    $idArray | ForEach-Object { Write-Host "  - $_" }

                    # Bulk delete (waits for completion). az resource delete accepts
                    # multiple --ids and handles dependency ordering best-effort.
                    Write-Host "`nDeleting (this may take a few minutes)..."
                    az resource delete --ids @idArray --verbose
                    if ($LASTEXITCODE -ne 0) {
                        Write-Host "Bulk delete reported errors. Retrying any leftovers individually..." -ForegroundColor DarkYellow
                        $leftover = az resource list -g $rg --query $preserveQuery -o tsv
                        foreach ($id in ($leftover -split "`n" | Where-Object { $_ })) {
                            Write-Host "  Retry: $id"
                            az resource delete --ids $id --verbose 2>$null
                        }
                    }
                }

                # Safety net only: if a KV slipped into soft-delete from a previous
                # cleanup pattern, purge it now so the next run isn't blocked.
                Write-Host "`nSafety check: any soft-deleted Key Vaults matching 'portfolio*' in $loc?"
                $deleted = az keyvault list-deleted --query "[?starts_with(name,'portfolio') && properties.location=='$loc'].name" -o tsv
                if ($deleted) {
                    foreach ($name in ($deleted -split "`n" | Where-Object { $_ })) {
                        Write-Host "  Purging stray soft-deleted vault: $name..."
                        az keyvault purge --name $name --location $loc --no-wait
                    }
                } else {
                    Write-Host "None — KV preservation is working as expected."
                }

                # Fail the stage so the overall pipeline run is still marked failed
                # (cleanup succeeding doesn't mean the deploy succeeded).
                Write-Host "`nCleanup complete. RG '$rg' preserved; deploy failure preserved." -ForegroundColor Yellow
                exit 1
